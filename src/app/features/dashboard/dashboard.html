<div class="dashboard-page">
    <header class="dashboard-header">
        <div class="header-brand"><span class="brand-name">Nutrit</span></div>
        <div class="header-user">
            <img [src]="'https://ui-avatars.com/api/?name=' + auth.currentUser()?.name + '&background=4CAF50&color=fff'" class="user-avatar">
        </div>
    </header>
    <main class="dashboard-main">
        <section class="dashboard-greeting">
            <h1>Buenos días, <span class="user-name">{{ auth.currentUser()?.name }}!</span></h1>
            <p>Tu meta diaria es: <strong>{{ dailyCalories() }} kcal</strong></p>
        </section>
        <div class="dashboard-grid">
            <app-dashboard-top [water]="nutrition.water()" [steps]="nutrition.steps()" [kcal]="nutrition.totalKcal()"></app-dashboard-top>
            <app-dashboard-bottom 
                [user]="auth.currentUser()!" [bmi]="bmi()" [foods]="nutrition.foods()" [achievements]="nutrition.achievements()"
                (addFood)="handleAddFood($event)" (deleteFood)="handleDeleteFood($event)">
            </app-dashboard-bottom>
        </div>
    </main>
</div>
