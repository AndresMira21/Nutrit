<div class="summary-row">
    <div class="summary-card">
        <div class="summary-icon water">Agua</div>
        <div class="summary-value">{{ water() }}</div>
        <div class="summary-label">Water</div>
    </div>
    <div class="summary-card">
        <div class="summary-icon steps">Pasos</div>
        <div class="summary-value">{{ steps() }}</div>
        <div class="summary-label">Steps</div>
    </div>
    <div class="summary-card">
        <div class="summary-icon kcal">Kcal</div>
        <div class="summary-value">{{ kcal() | number }}</div>
        <div class="summary-label">kcal Intake</div>
    </div>
</div>
<div class="macros-card">
    <h3 class="card-title">Macronutrients Today</h3>
    @defer (on viewport) {
        <div style="height: 180px; background: #e0f2e9; display: flex; align-items: center; justify-content: center; border-radius: 8px;">
            <p>Gráfico Pesado Cargado Correctamente</p>
        </div>
    } @placeholder {
        <div class="chart-placeholder">Desliza para cargar el gráfico...</div>
    }
</div>
