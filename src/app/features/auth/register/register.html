<div class="login-page">
    <div class="login-visual"><div class="visual-image"><div class="image-placeholder"></div></div></div>
    <div class="login-panel">
        <div class="login-form-container">
            <div class="brand"><span class="brand-name">Nutrit</span></div>
            <h1 class="login-title">Crear una Cuenta</h1>
            <form class="login-form" [formGroup]="registerForm" (ngSubmit)="register()">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" formControlName="email" placeholder="Tu correo">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" formControlName="password" placeholder="Mínimo 6 caracteres">
                </div>
                @if (errorMessage()) { <p style="color: red; font-size: 13px;">{{ errorMessage() }}</p> }
                <button type="submit" class="btn-login" [disabled]="registerForm.invalid">Registrarse</button>
            </form>
            <p class="signup-text">
                ¿Ya tienes cuenta? <a routerLink="/login">Inicia Sesión</a>
            </p>
        </div>
    </div>
</div>
