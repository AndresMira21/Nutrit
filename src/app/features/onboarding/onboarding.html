<div class="onboarding-wrapper">
  <div class="onboarding-card">
    
    <div class="progress-header">
      <ol class="steps" aria-label="Progreso del registro">
        @for (label of stepLabels; track $index) {
          <li [class.active]="step() === $index + 1" [class.done]="step() > $index + 1">
            {{ $index + 1 }}. {{ label }}
          </li>
        }
      </ol>
      <div class="progress-bar">
        <div class="progress-fill" [style.width.%]="progress()"></div>
      </div>
    </div>

    <form [formGroup]="onboardingForm" (ngSubmit)="saveProfile()" novalidate>
      @if (step() === 1) {
        <app-step-personal [group]="personalGroup"></app-step-personal>
        <button type="button" class="btn-primary" (click)="next()">Siguiente paso</button>
      }

      @if (step() === 2) {
        <app-step-habits [group]="habitsGroup" [mealsGroup]="mealsGroup"></app-step-habits>
        <div class="button-row">
          <button type="button" class="btn-secondary" (click)="back()">Atrás</button>
          <button type="submit" class="btn-primary" [disabled]="isLoading()">
            {{ isLoading() ? 'Calculando...' : 'Finalizar' }}
          </button>
        </div>
      }
    </form>
  </div>
</div>
