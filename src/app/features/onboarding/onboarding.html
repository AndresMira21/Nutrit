<div class="login-page">
  <div class="login-panel" style="margin: 0 auto; max-width: 500px;">
    <div class="login-form-container">
      <h1 class="login-title">Completa tu Perfil</h1>
      <form class="login-form" [formGroup]="profileForm" (ngSubmit)="saveProfile()">
        <div class="form-group"><label>Peso (kg)</label><input type="number" formControlName="weight"></div>
        <div class="form-group"><label>Estatura (cm)</label><input type="number" formControlName="height"></div>
        <div class="form-group"><label>Edad</label><input type="number" formControlName="age"></div>
        <div class="form-group">
          <label>Género</label>
          <select formControlName="gender" style="padding: 12px; border-radius: 6px; border: 1px solid #E0E0E0;">
            <option value="male">Hombre</option>
            <option value="female">Mujer</option>
          </select>
        </div>
        <button type="submit" class="btn-login" [disabled]="profileForm.invalid">Calcular mi Dieta</button>
      </form>
    </div>
  </div>
</div>
